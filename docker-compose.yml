 

services:
  mongodb:
    image: mongo:latest
    container_name: diplom-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpass
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  app:
    build: .
    container_name: hotel-booking-live
    restart: always
    ports:
      - '80:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://admin:adminpass@mongodb:27017/hoteldb?authSource=admin
      - JWT_SECRET=super_secret_key_2026
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - mongodb
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge
